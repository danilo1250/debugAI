<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>debugAI — Análise Compartilhada</title>
  <meta name="description" content="Veja esta análise de código feita pelo debugAI — IA para devs que odeiam perder tempo.">
  <meta property="og:title" content="debugAI — Análise Compartilhada">
  <meta property="og:description" content="Veja esta análise de código gerada por IA.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://debugai-uhqi.onrender.com">
  <link rel="stylesheet" href="style.css" />
  <style>
    .shared-container {
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }
    .shared-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .shared-header .logo {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--accent);
      text-decoration: none;
    }
    .shared-header p {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 0.5rem;
    }
    .shared-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md, 12px);
      padding: 2rem;
      margin-bottom: 2rem;
    }
    .shared-meta {
      display: flex;
      gap: 1rem;
      align-items: center;
      margin-bottom: 1.2rem;
      flex-wrap: wrap;
    }
    .shared-type {
      background: var(--accent);
      color: #000;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.25rem 0.7rem;
      border-radius: 12px;
      text-transform: uppercase;
    }
    .shared-date {
      color: var(--text-muted);
      font-size: 0.8rem;
    }
    .shared-error {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      font-family: monospace;
      font-size: 0.82rem;
      color: var(--text-secondary);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .shared-response {
      line-height: 1.7;
      color: var(--text);
    }
    .shared-response h2 {
      font-size: 1.1rem;
      margin: 1.5rem 0 0.5rem;
      color: var(--accent);
    }
    .shared-response h3 {
      font-size: 1rem;
      margin: 1.2rem 0 0.4rem;
    }
    .shared-response pre {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      overflow-x: auto;
      font-size: 0.82rem;
    }
    .shared-response code {
      background: rgba(99, 102, 241, 0.1);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-size: 0.85em;
    }
    .shared-response pre code {
      background: none;
      padding: 0;
    }
    .shared-response ul {
      padding-left: 1.5rem;
    }
    .shared-response li {
      margin-bottom: 0.4rem;
    }
    .shared-cta {
      text-align: center;
      margin-top: 2.5rem;
      padding: 2rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md, 12px);
    }
    .shared-cta h3 {
      margin-bottom: 0.5rem;
    }
    .shared-cta p {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 1.2rem;
    }
    .shared-cta a {
      display: inline-block;
      background: var(--accent);
      color: #000;
      font-weight: 700;
      padding: 0.75rem 2rem;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.9rem;
      transition: opacity 0.2s;
    }
    .shared-cta a:hover {
      opacity: 0.85;
    }
    .shared-loading {
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
    }
    .shared-error-msg {
      text-align: center;
      padding: 3rem;
      color: var(--error, #ef4444);
    }
  </style>
</head>
<body>
  <div class="shared-container">
    <div class="shared-header">
      <a href="/" class="logo">debugAI</a>
      <p>análise de código compartilhada</p>
    </div>

    <div id="shared-loading" class="shared-loading">
      ⏳ carregando análise...
    </div>

    <div id="shared-error" class="shared-error-msg" style="display:none;">
      ❌ Análise não encontrada ou link inválido.
    </div>

    <div id="shared-content" style="display:none;">
      <div class="shared-card">
        <div class="shared-meta">
          <span class="shared-type" id="shared-type">erro</span>
          <span class="shared-date" id="shared-date"></span>
        </div>
        <div class="shared-error" id="shared-input-error"></div>
        <div class="shared-response" id="shared-response"></div>
      </div>

      <div class="shared-cta">
        <h3>🚀 quero usar também</h3>
        <p>O debugAI analisa erros, encontra a causa raiz e sugere correção em segundos usando IA.</p>
        <a href="/app.html">começar grátis →</a>
      </div>
    </div>
  </div>

  <script>
    (async function loadSharedAnalysis() {
      const params = new URLSearchParams(window.location.search);
      const shareId = params.get("id");

      if (!shareId) {
        document.getElementById("shared-loading").style.display = "none";
        document.getElementById("shared-error").style.display = "block";
        return;
      }

      try {
        const res = await fetch(`/api/shared/${shareId}`);

        if (!res.ok) {
          document.getElementById("shared-loading").style.display = "none";
          document.getElementById("shared-error").style.display = "block";
          return;
        }

        const data = await res.json();

        document.getElementById("shared-type").textContent = data.type === "review" ? "revisão" : "erro";
        document.getElementById("shared-date").textContent = formatDate(data.created_at);
        document.getElementById("shared-input-error").textContent = data.input_error || "";
        document.getElementById("shared-response").innerHTML = renderMarkdown(data.response || "");

        document.getElementById("shared-loading").style.display = "none";
        document.getElementById("shared-content").style.display = "block";
      } catch (err) {
        console.error("Erro ao carregar análise:", err);
        document.getElementById("shared-loading").style.display = "none";
        document.getElementById("shared-error").style.display = "block";
      }
    })();

    function formatDate(dateStr) {
      if (!dateStr) return "";
      const date = new Date(dateStr + "Z");
      return date.toLocaleDateString("pt-BR") + " " + date.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
    }

    function renderMarkdown(text) {
      if (!text) return "";
      return text
        .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
        .replace(/^## (.+)$/gm, '<h2>$1</h2>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/^- (.+)$/gm, '<li>$1</li>')
        .replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>')
        .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
        .replace(/\n\n/g, '</p><p>')
        .replace(/\n/g, '<br/>')
        .replace(/^(?!<[hupol])(.+)/gm, '<p>$1</p>');
    }
  </script>
</body>
</html>
